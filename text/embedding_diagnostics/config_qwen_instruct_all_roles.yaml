input:
  units_csv: dataset/families/btp/data_btp_building_construction_and_masonry.csv
  fact_id_col: fact_id
  role_col: pred_label
  valid_col: pred_ok
  text_col: sentence

model:
  name: Qwen/Qwen3-Embedding-0.6B
  max_length: 256
  batch_size: 32
  precision: bfloat16

roles:
  B:
    instruction: >-
      Represent occupational accident factual units for clustering by the
      accident event mechanism explicitly described. Prioritize the type of
      physical event or process and its essential participants, including who
      or what falls, strikes, collapses, overturns, or is otherwise affected.
      Group equivalent mechanisms across different equipment and work
      contexts, while distinguishing different mechanisms involving the same
      equipment. De-emphasize occupations, locations, injuries, and
      consequences unless they are essential to identifying the event. Do not
      infer unstated causes or outcomes.
    embeddings_csv: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_B_mechanism_instruct.csv
    manifest_json: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_B_mechanism_instruct.manifest.json

  A0:
    instruction: >-
      Represent occupational accident factual units for clustering by the
      neutral work activity or situation explicitly described. Prioritize the
      type of activity, the action performed, and its essential objects or
      context. Group equivalent work situations across different occupations,
      equipment, or worksites when these differences do not change the nature
      of the activity. Preserve meaningful distinctions between activities.
      Do not infer hazards, accident events, or consequences.
    embeddings_csv: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_A0_work_situation_instruct.csv
    manifest_json: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_A0_work_situation_instruct.manifest.json

  A1:
    instruction: >-
      Represent occupational accident factual units for clustering by the
      adverse work condition explicitly described. Prioritize the nature of
      the unsafe state, missing or defective safeguard, hazardous condition,
      or organizational deficiency, together with the entity affected. Group
      equivalent adverse conditions across different equipment and work
      contexts. Distinguish different types of adverse conditions even when
      they involve the same object. Do not infer unstated hazards, causes, or
      accident events.
    embeddings_csv: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_A1_adverse_condition_instruct.csv
    manifest_json: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_A1_adverse_condition_instruct.manifest.json

  C:
    instruction: >-
      Represent occupational accident factual units for clustering by the
      bodily harm or health consequence explicitly reported. Prioritize the
      type of injury, symptom, health impairment, or medical outcome. Group
      equivalent types of harm across different accident mechanisms and work
      contexts. Treat anatomical location and severity as secondary
      characteristics unless they are essential to distinguishing the
      reported consequence. Preserve distinctions between injuries, symptoms,
      and outcomes such as hospitalization or death. Do not infer unstated
      medical consequences.
    embeddings_csv: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_C_health_consequence_instruct.csv
    manifest_json: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_C_health_consequence_instruct.manifest.json
