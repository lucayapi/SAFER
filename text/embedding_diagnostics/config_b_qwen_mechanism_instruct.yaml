input:
  units_csv: dataset/families/btp/data_btp_building_construction_and_masonry.csv
  fact_id_col: fact_id
  role_col: pred_label
  valid_col: pred_ok
  text_col: sentence
  selected_role: B

model:
  name: Qwen/Qwen3-Embedding-0.6B
  max_length: 256
  batch_size: 32
  precision: bfloat16

instruction: >-
  Represent occupational accident factual units for clustering by the
  accident event mechanism explicitly described. Prioritize the type of
  physical event or process and its essential participants, including who or
  what falls, strikes, collapses, overturns, or is otherwise affected. Group
  equivalent mechanisms across different equipment and work contexts, while
  distinguishing different mechanisms involving the same equipment.
  De-emphasize occupations, locations, injuries, and consequences unless they
  are essential to identifying the event. Do not infer unstated causes or
  outcomes.

output:
  embeddings_csv: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_B_mechanism_instruct.csv
  manifest_json: embeddings/instructed/btp_building_construction_and_masonry/Qwen3-Embedding-0.6B_btp_B_mechanism_instruct.manifest.json
