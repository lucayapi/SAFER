# Repair campaign for the 15 adapted CamemBERT runs whose previous resolved
# configurations inherited data_btp.csv. This recipe writes to a new output
# root and intentionally excludes all valid Construction and frozen runs.
output_root: output/camembert_metallurgie_repair
storage:
  cleanup_after_completion: true
  keep_final_checkpoint: false
  keep_embeddings: false
  max_parallel_seeds: 3
training:
  n_seeds: 5
  seed_generator: 2026
  split_seed: 42
  n_folds: 3
  selection_metric: balanced_accuracy
  test_corpora: [btp, metallurgie, caou, nicollin]
bootstrap:
  n_resamples: 2000
  seed: 2027
  confidence_level: 0.95

model_templates:
  camembert_cross_entropy_metallurgie:
    runner: supervised_macro_ft
    base_config: configs/methods/supervised_macro_ft.yaml
    overrides:
      data:
        data_csv: dataset/data_metallurgie.csv
        dataset_path: dataset/data_metallurgie.csv
      model:
        backbone_name: almanach/camembert-base
        input_prefix: ""
        backbone_trainable: true
        train_last_n_layers: 3
        max_seq_length: 256
        pooling: mean
        use_projector: false
        projection: null
        hiddim: 128
        proj_hidden: 256
        dropout: 0.1
        n_classes: 4
        oversampling: false
        class_weight: balanced
        gradient_checkpointing: true
        cache_backbone_embeddings: false
        standardize_backbone: false
      training:
        epochs: 10
        batch_size: 32
        lr_backbone: 2.0e-5
        lr_projector: 1.0e-3
        lr_head: 1.0e-3
        weight_decay: 0.01
        early_stopping_patience: 3
        early_stopping_inner_val_ratio: 0.1
        final_epochs_from_cv: true
        use_amp: true
      exports: {save_btp_embeddings: false, save_checkpoint: false}

  camembert_supcon_metallurgie:
    runner: contrastive
    method: supcon
    base_config: configs/methods/supcon.yaml
    classifier: {C: 0.01, class_weight: balanced, penalty: l2, solver: lbfgs}
    overrides:
      data: {dataset_path: dataset/data_metallurgie.csv}
      model:
        backbone_name: almanach/camembert-base
        input_prefix: ""
        backbone_trainable: true
        train_last_n_layers: 3
        cache_backbone_embeddings: false
        use_projector: false
        projection: null
        hiddim: 128
        max_seq_length: 256
        pooling: mean
      training:
        batch_size: 64
        eval_batch_size: 64
        encode_batch_size: 64
        epochs: 10
        early_stopping_patience: 3
        early_stopping_inner_val_ratio: 0.1
        final_epochs_from_cv: true
        learning_rate: 2.0e-5
        gradient_accumulation_steps: 1
        distance_metric: cosine
        use_amp: true
      supcon: {temperature: 0.07, base_temperature: 0.07, contrast_mode: all, normalize_embeddings: true}
      post_eval: {enabled: true, oversampling: false}

  camembert_softtriple_metallurgie:
    runner: contrastive
    method: softtriple
    base_config: configs/methods/softtriple.yaml
    classifier: {C: 0.01, class_weight: balanced, penalty: l2, solver: lbfgs}
    overrides:
      data: {dataset_path: dataset/data_metallurgie.csv}
      model:
        backbone_name: almanach/camembert-base
        input_prefix: ""
        backbone_trainable: true
        train_last_n_layers: 3
        cache_backbone_embeddings: false
        use_projector: true
        projection: mlp_sklearn
        hiddim: 128
        max_seq_length: 256
        pooling: mean
      training:
        batch_size: 64
        eval_batch_size: 64
        encode_batch_size: 64
        epochs: 10
        early_stopping_patience: 3
        early_stopping_inner_val_ratio: 0.1
        final_epochs_from_cv: true
        learning_rate: 2.0e-5
        gradient_accumulation_steps: 1
        distance_metric: cosine
        use_amp: true
      softtriple:
        centers_per_class: 20
        gamma: 0.1
        lambda: 10.0
        delta: 0.01
        tau: 0.2
        normalize_embeddings: true
        normalize_centers: true
        center_max_similarity: 0.5
        center_min_distance: 0.3
        center_regularization_type: merge_l21
      post_eval: {enabled: true, oversampling: false}

models:
  camembert_metallurgie_cross_entropy:
    template: camembert_cross_entropy_metallurgie
    source_corpus: metallurgie
  camembert_metallurgie_supcon:
    template: camembert_supcon_metallurgie
    source_corpus: metallurgie
  camembert_metallurgie_softtriple:
    template: camembert_softtriple_metallurgie
    source_corpus: metallurgie
