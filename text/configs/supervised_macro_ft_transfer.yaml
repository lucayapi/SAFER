method_name: supervised_macro_ft
corpus: metallurgie
method_display_name: "Supervised macro FT (CE) + BERTopic"

checkpoint: output/supervised_macro_ft/checkpoints/best_model

# run_bertopic: true  → transfert + BERTopic + topic judge
# run_bertopic: false → classification uniquement
run_bertopic: true

target:
  dataset_path: dataset/test/data_metallurgie.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  raw_emb_csv: embeddings/test/Qwen3-Embedding-0.6B_metallurgie.csv

model:
  max_seq_length: 256
  encode_batch_size: 32
  device: cuda
  reuse_cached_embeddings: true

exports:
  save_target_embeddings: true
  save_bertopic_inputs: true

bertopic_shared: configs/bertopic_macro_shared.yaml
