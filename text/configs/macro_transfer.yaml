# Transfert macro + topics intra-macro sur corpus de test.
# Corpus : configs/test_corpora.yaml (clé ``corpus`` ci-dessous).
# Usage :
#   python scripts/run_macro_transfer_discovery.py --method scgm_text --corpus metallurgie
#   CORPUS=metallurgie CONFIG=configs/macro_transfer.yaml bash jobs/run_macro_transfer.sh
#
# Libellés topics : bertopic.representation.OpenAI (enabled: true par défaut).

corpus: metallurgie

checkpoints:
  scgm_text: output/scgm_text/checkpoints/best_model.pt
  softtriple: output/softtriple/checkpoints/best_model

text_col: sentence
label_col: pred_label
pred_ok_col: pred_ok

confidence_threshold: 0.5
macro_temperature: 1.0
softtriple_gamma: 0.1
scgm_tau: null

batch_size: 512
infer_batch_size: 4096
device: cuda

bertopic:
  # true = topics sur toutes les unités m_hat (y compris q_conf < confidence_threshold)
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null
  umap:
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom
  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]
  representation:
    enabled: true
    model: gpt-4o-mini
    chat: true
    nr_docs: 50
    doc_length: 100
    tokenizer_model: gpt-4o-mini
    delay_in_seconds: 2
    diversity: null
    exponential_backoff: false
    prompt: null

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: false
