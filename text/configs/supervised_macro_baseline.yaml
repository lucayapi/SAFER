# Référence optionnelle — le notebook 07 embarque sa config (voir notebooks/07_supervised_macro_baseline.ipynb).
# Conservé pour run_supervised_baseline_from_config().
method_name: supervised_macro_baseline
corpus: metallurgie

n_folds: 5
seed: 42
selection_metric: balanced_accuracy

# output_test/<corpus>/supervised_baseline/

source:
  dataset_path: dataset/data_btp.csv
  emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok

target:
  # Surchargé à l'exécution via cfg["corpus"] + registre test_corpora.yaml
  dataset_path: dataset/data_metallurgie.csv
  emb_csv: embeddings/Qwen3-Embedding-0.6B_metallurgie.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id

models:
  logistic_regression:
    use_scaler: true
    params:
      C: 1.0
      class_weight: balanced
      max_iter: 2000
      solver: lbfgs
  random_forest:
    use_scaler: false
    params:
      n_estimators: 300
      max_depth: null
      class_weight: balanced
  xgboost:
    use_scaler: false
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      objective: multi:softprob
      eval_metric: mlogloss
  mlp:
    use_scaler: true
    params:
      hidden_layer_sizes: [256, 128]
      max_iter: 500
      early_stopping: true
      class_weight: balanced
