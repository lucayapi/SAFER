# Follow-up to CE+PGC pilot: target-only lambda diagnostics and source-selected SupCon+PGC.
# No target labels are used to choose lambda. Results are exploratory.
output_root: output/pgc_followup
source_csv: dataset/data_btp.csv
targets: [metallurgie, caou, nicollin]
lambda_grid: [0.0, 0.01, 0.05, 0.1, 0.25]
split_seed: 42
cv_seed: 2026
seed_generator: 2026
n_seeds: 3
n_folds: 3
n_bootstrap: 2000
bootstrap_seed: 2027
diagnostics_every: 20
edges: [[A0, A1], [A0, B], [A1, B], [B, C]]
data:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id
model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  backbone_trainable: true
  train_last_n_layers: null
  gradient_checkpointing: true
  pooling: mean
  projection: null
  max_seq_length: 256
  n_classes: 4
training:
  epochs: 3
  batch_size: 32
  accident_chunk_size: 8
  eval_batch_size: 32
  lr_backbone: 2.0e-6
  lr_head: 1.0e-3
  weight_decay: 0.01
  class_weight: balanced
  use_amp: false
supcon:
  batch_size: 64
  accident_chunk_size: 8
  eval_batch_size: 64
  learning_rate: 2.0e-6
  weight_decay: 0.01
  temperature: 0.07
  base_temperature: 0.07
  classifier_c: 0.01
  classifier_class_weight: balanced
  projection: mlp_sklearn
  hiddim: 128
