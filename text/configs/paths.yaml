# Racines du pipeline SAFER (relatives à text/)

text_root: .
dataset_dir: dataset
config_dir: configs
output_root: output
jobs_dir: jobs
notebooks_dir: notebooks

methods:
  raw_embedding: output/raw_embedding
  scgm_text: output/scgm_text
  batch_triplet: output/batch_triplet
  softtriple: output/softtriple
  supcon: output/supcon
  comparisons: output/comparisons

# Sorties corpus de test (hors entraînement BTP) — configs/test_corpora.yaml
output_test_root: output_test
method_test_pattern: "output_test/{corpus_id}/{method}/"
macro_transfer_pattern: "output_test/{corpus_id}/macro_transfer/{method}/"
bn_results_pattern: "output_test/{corpus_id}/bn_results/"
raw_embedding_test_pattern: "output_test/{corpus_id}/raw_embedding/"
