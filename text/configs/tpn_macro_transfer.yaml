# Transfert macro TPN (encodeur gelé modulable + adaptateur prototypique).
# Sorties : output_test/<corpus>/macro_transfer/tpn_<encodeur>/
#
# Usage (défaut SCGM) :
#   CORPUS=metallurgie bash jobs/run_tpn_macro_transfer.sh
# Autres encodeurs (même fichier) :
#   BASE_METHOD=softtriple CORPUS=metallurgie bash jobs/run_tpn_macro_transfer.sh
#   CHECKPOINT=output/scgm_text_speed/checkpoints/best_model.pt bash jobs/run_tpn_macro_transfer.sh

corpus: metallurgie

checkpoints:
  scgm_text: output/scgm_text/checkpoints/best_model.pt
  softtriple: output/softtriple/checkpoints/best_model
  supcon: output/supcon/checkpoints/best_model
  batch_triplet: output/batch_triplet/checkpoints/best_model

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id
  # SCGM mode precomputed : emb_csv embeddings/Qwen3-Embedding-0.6B_btp.csv

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  base_method: scgm_text
  # checkpoint — checkpoints.<base_method> ou CHECKPOINT / --checkpoint CLI
  # emb_csv cible SCGM — registre test_corpora.yaml si omis
  # contrastive_config — auto configs/methods/<encodeur>.yaml si encodeur contrastif

macros: ["A0", "A1", "B", "C"]

encoding:
  device: "cuda"
  encode_batch_size: 8
  # End2end SCGM (texte → Qwen → projecteur) ; baisser si OOM GPU
  scgm_text_batch_size: 64
  # scgm_infer_batch_size: 512  # uniquement si mode precomputed (source/method.emb_csv)
  log_every_batches: 1
  normalize_embeddings: true

tpn:
  seed: 42
  epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  detach_assignments: true
  target_weight_st: 1.0

adapter:
  type: residual_mlp
  bottleneck_dim: 256
  dropout: 0.05
  scale: 0.1
  init_last_zero: true

loss_weights:
  src: 1.0
  proto: 0.5
  kl: 0.5
  ent: 0.01
  div: 0.05
  preserve: 0.25

gating:
  confidence_threshold: 0.35
  margin_threshold: 0.03
  ambiguous_rule: confidence_or_margin

bertopic:
  enabled: true
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null

  embedding_space:
    mode: mixed
    alpha: 0.25
    normalize: true

  macro_params:
    A0:
      min_topic_size: 25
      min_cluster_size: 25
      min_samples: 3
      cluster_selection_method: leaf
      n_neighbors: 10
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    A1:
      min_topic_size: 20
      min_cluster_size: 20
      min_samples: 3
      cluster_selection_method: leaf
      n_neighbors: 10
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    B:
      min_topic_size: 35
      min_cluster_size: 35
      min_samples: 10
      cluster_selection_method: eom
      n_neighbors: 15
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    C:
      min_topic_size: 70
      min_cluster_size: 70
      min_samples: 15
      cluster_selection_method: eom
      n_neighbors: 20
      n_components: 5
      min_dist: 0.0
      nr_topics: null

  grid_search:
    enabled: false
    macros: [A0, A1]
    alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
    min_cluster_size: [10, 15, 20, 25, 30, 40]
    min_samples: [1, 3, 5, 10]
    cluster_selection_method: [eom, leaf]

  diagnostics:
    enabled: true
    compute_compression: true
    compute_topic_stats: true
    save_representative_docs: true
    n_representative_docs: 5

  umap:
    enabled: true
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom

  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]

  representation:
    enabled: true
    include_corpus_context: true
    model: gpt-4o-mini
    chat: true
    nr_docs: 50
    doc_length: 100
    tokenizer_model: gpt-4o-mini
    delay_in_seconds: 2
    diversity: null
    exponential_backoff: false
    prompt: null

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: false
