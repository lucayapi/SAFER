# Transfert macro TPN (encodeur gelé modulable + adaptateur prototypique).
# Sorties : output_test/<corpus>/macro_transfer/tpn_<encodeur>/
#
# Usage (SoftTriple, défaut) :
#   CORPUS=metallurgie bash jobs/run_tpn_macro_transfer.sh
# Autres encodeurs :
#   CONFIG=configs/tpn_macro_transfer_supcon.yaml bash jobs/run_tpn_macro_transfer.sh
#   BASE_METHOD=supcon CONFIG=configs/tpn_macro_transfer.yaml python scripts/run_tpn_macro_transfer_discovery.py ...

corpus: metallurgie

checkpoints:
  softtriple: output/softtriple/checkpoints/best_model
  supcon: output/supcon/checkpoints/best_model
  batch_triplet: output/batch_triplet/checkpoints/best_model
  scgm_text: output/scgm_text/checkpoints/best_model.pt

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id
  # SCGM source : embeddings BTP Qwen (si absent → voir embeddings/ du registre BTP)
  # emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  name: tpn_softtriple
  base_method: softtriple
  # checkpoint : utiliser checkpoints.<base_method> ou --checkpoint CLI
  contrastive_config: configs/methods/softtriple.yaml
  # emb_csv cible SCGM : registre test_corpora.yaml si omis
  # source.emb_csv requis pour scgm_text + precomputed_embeddings (BTP)

macros: [A0, A1, B, C]

encoding:
  device: cuda
  encode_batch_size: 8
  normalize_embeddings: true

tpn:
  seed: 42
  epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  detach_assignments: true
  target_weight_st: 1.0

adapter:
  type: residual_mlp
  bottleneck_dim: 256
  dropout: 0.05
  scale: 0.1
  init_last_zero: true

loss_weights:
  src: 1.0
  proto: 0.5
  kl: 0.5
  ent: 0.01
  div: 0.05
  preserve: 0.25

gating:
  confidence_threshold: 0.35
  margin_threshold: 0.03
  ambiguous_rule: confidence_or_margin

bertopic:
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null

  umap:
    enabled: true
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom

  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]

  representation:
    enabled: true
    include_corpus_context: true
    model: gpt-4o-mini
    chat: true
    nr_docs: 50
    doc_length: 100
    tokenizer_model: gpt-4o-mini
    delay_in_seconds: 2
    diversity: null
    exponential_backoff: false
    prompt: null

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: false
