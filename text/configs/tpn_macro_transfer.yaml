corpus: metallurgie

checkpoints:
  scgm_text: output/scgm_text/checkpoints/best_model.pt
  softtriple: output/softtriple/checkpoints/best_model
  supcon: output/supcon/checkpoints/best_model
  batch_triplet: output/batch_triplet/checkpoints/best_model

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  name: tpn_full_scgm_text
  base_method: scgm_text
  checkpoint: output/scgm_text/checkpoints/best_model.pt
  backbone_name: Qwen/Qwen3-Embedding-0.6B

encoding:
  max_seq_length: 256
  normalize_embeddings: true
  pooling: mean
  device: cuda

full_encoder:
  freeze_backbone: false
  source_batch_size: 16
  target_batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true
  bf16: false
  balanced_source_batches: true
  source_batch_with_replacement: true
  min_per_macro: 1
  drop_last: true
  prototype_mode: batch
  reuse_initial_embeddings: true
  force_reencode_initial: false
  ema_momentum: 0.95
  progress_every: 25

tpn:
  objective: standard_tpn
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  pseudo_label_strategy: per_class_topk
  pseudo_label_threshold: 0.6
  pseudo_label_min_confidence: 0.25
  pseudo_label_min_per_macro: 8
  pseudo_label_threshold_per_macro:
    A0: 0.6
    A1: 0.6
    B: 0.35
    C: 0.6
  target_weight_st: 1.0
  src_classifier_prototypes: source

loss_weights:
  src: 1.0
  proto: 1.0
  kl: 1.0

gating:
  confidence_threshold: 0.35
  margin_threshold: 0.03
  ambiguous_rule: confidence_or_margin

bertopic:
  enabled: true
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null

  embedding_space:
    mode: mixed
    alpha: 0.25
    normalize: true

  macro_params:
    A0:
      min_topic_size: 25
      min_cluster_size: 25
      min_samples: 3
      cluster_selection_method: leaf
      n_neighbors: 10
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    A1:
      min_topic_size: 20
      min_cluster_size: 20
      min_samples: 3
      cluster_selection_method: leaf
      n_neighbors: 10
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    B:
      min_topic_size: 35
      min_cluster_size: 35
      min_samples: 10
      cluster_selection_method: eom
      n_neighbors: 15
      n_components: 5
      min_dist: 0.0
      nr_topics: null
    C:
      min_topic_size: 70
      min_cluster_size: 70
      min_samples: 15
      cluster_selection_method: eom
      n_neighbors: 20
      n_components: 5
      min_dist: 0.0
      nr_topics: null

  grid_search:
    enabled: false
    macros: [A0, A1]
    alphas: [0.0, 0.25, 0.5, 0.75, 1.0]
    min_cluster_size: [10, 15, 20, 25, 30, 40]
    min_samples: [1, 3, 5, 10]
    cluster_selection_method: [eom, leaf]

  diagnostics:
    enabled: true
    compute_compression: true
    compute_topic_stats: true
    save_representative_docs: true
    n_representative_docs: 5

  umap:
    enabled: true
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom

  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]

  representation:
    enabled: true
    include_corpus_context: true
    model: gpt-4o-mini
    chat: true
    nr_docs: 50
    doc_length: 100
    tokenizer_model: gpt-4o-mini
    delay_in_seconds: 2
    diversity: null
    exponential_backoff: false
    prompt: null

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: true
