# Source unique BERTopic intra-macro (FSP + baseline supervisée).
# Surcharges possibles via bertopic: / topics_export: dans le YAML du run.

bertopic:
  enabled: true
  random_state: 42
  min_topic_size: 10
  include_ambiguous: false
  umap:
    enabled: true
    n_components: 15
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
  macro_params:
    A0:
      cluster_selection_method: eom
      min_cluster_size: 8
      min_samples: 2
      min_topic_size: 8
    A1:
      cluster_selection_method: eom
      min_cluster_size: 8
      min_samples: 2
      min_topic_size: 8
    B:
      cluster_selection_method: eom
      min_cluster_size: 8
      min_samples: 2
      min_topic_size: 8
    C:
      cluster_selection_method: eom
      min_cluster_size: 8
      min_samples: 2
      min_topic_size: 8
  representation:
    enabled: true
    model: gpt-5-mini
    chat: true
    nr_docs: 50
    # Contexte macro A0–C (contexte / facteurs / événement / conséquences) — configs/accident_macros.yaml
    include_corpus_context: true
    # Contexte sectoriel BTP / métallurgie / caou (désactivé par défaut)
    include_sector_context: false
    fallback_on_error: true
    exponential_backoff: true
    delay_in_seconds: 0.75
  diagnostics:
    show_progress: true
    save_datamap: false
    save_model: true
    save_representative_docs: true
    n_representative_docs: 5

topic_judge:
  enabled: true
  model: gpt-5-mini
  n_representative: 30
  n_random: 5
  min_n_units: 8
  # temperature ignorée pour gpt-5* (seule la valeur par défaut 1 est acceptée par l'API)
  show_progress: true
  abort_on_openai_error: true

topics_export:
  top_k_words: 12
  top_k_sentences: 5
