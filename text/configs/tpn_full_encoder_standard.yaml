corpus: metallurgie

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  name: tpn_full_encoder_standard
  base_method: softtriple
  checkpoint: output/softtriple/checkpoints/best_model
  backbone_name: Qwen/Qwen3-Embedding-0.6B

encoding:
  max_seq_length: 256
  normalize_embeddings: true
  pooling: mean
  device: cuda

full_encoder:
  freeze_backbone: false
  source_batch_size: 16
  target_batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true
  bf16: false
  balanced_source_batches: true
  source_batch_with_replacement: true
  min_per_macro: 1
  drop_last: true
  prototype_mode: batch

tpn:
  objective: standard_tpn
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  pseudo_label_strategy: per_class_topk
  pseudo_label_threshold: 0.6
  pseudo_label_min_confidence: 0.25
  pseudo_label_min_per_macro: 8
  target_weight_st: 1.0
  src_classifier_prototypes: source

loss_weights:
  src: 1.0
  proto: 1.0
  kl: 1.0
  ent: 0.0
  div: 0.0
  reg: 0.0
  local: 0.0
  var: 0.0
  cov: 0.0
