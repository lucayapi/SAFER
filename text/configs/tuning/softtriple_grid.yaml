method_name: softtriple
base_config: configs/methods/softtriple.yaml
output_dir: output/softtriple/tuning
final_output_dir: output/softtriple
selection_metric: balanced_accuracy
n_folds: 5
seed: 42
test_corpora: [metallurgie, caou, nicollin]
final_fit_full_data: true

grid:
  training.learning_rate: [1.0e-5, 2.0e-5]
  training.batch_size: [8, 16]
  training.epochs: [15, 30]
  training.distance_metric: [euclidean]
  softtriple.gamma: [0.1, 0.2]
  softtriple.lambda: [5.0, 10.0]
  softtriple.delta: [0.01]
  softtriple.center_regularization_type: ["none", "merge_l21"]
  softtriple.tau: [0.0, 0.01, 0.05, 0.1]
  softtriple.centers_per_class: [5, 10]
  softtriple.center_min_distance: [0.3]
  softtriple.center_max_similarity: [0.5]
