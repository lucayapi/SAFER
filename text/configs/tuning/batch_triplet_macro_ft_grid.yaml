method_name: batch_triplet
base_config: configs/methods/batch_triplet.yaml
output_dir: output/batch_triplet/macro_ft_tuning
seed: 42
n_folds: 3
selection_metric: balanced_accuracy
test_corpora: [metallurgie, caou, nicollin]

architecture_grid:
  model.backbone_trainable: [true]
  model.train_last_n_layers: [1, 2, 3, null]
  model.use_projector: [true, false]
  model.projection: [mlp_sklearn]

logistic_grid:
  C: [0.01, 0.1, 1.0, 10.0]
  penalty: [l2]
  solver: [lbfgs]
  class_weight: [balanced]

full_training_overrides:
  training.epochs: 3
  training.use_amp: false
  training.learning_rate: 2.0e-6

epochs_by_encoder_scope:
  last_1: 30
  last_2: 15
  last_3: 10
  full: 3
