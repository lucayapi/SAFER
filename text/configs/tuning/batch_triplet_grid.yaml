method_name: batch_triplet
base_config: configs/methods/batch_triplet.yaml
output_dir: output/batch_triplet/tuning
final_output_dir: output/batch_triplet
selection_metric: eta2_macro_balanced_perc
n_folds: 5
seed: 42
test_corpus: metallurgie
final_fit_full_data: true

grid:
  training.learning_rate: [1.0e-5, 2.0e-5]
  training.batch_size: [8, 16]
  training.epochs: [15, 30]
  training.distance_metric: [euclidean]
