# TPN avec encodeur SCGM gelé (sortie : tpn_scgm_text/)
# Requiert emb_csv cible (registre test) + source.emb_csv pour BTP si mode precomputed.
corpus: metallurgie

checkpoints:
  scgm_text: output/scgm_text/checkpoints/best_model.pt

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id
  # emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  base_method: scgm_text
  checkpoint: output/scgm_text/checkpoints/best_model.pt

encoding:
  device: cuda
  encode_batch_size: 8
  scgm_infer_batch_size: 512
  normalize_embeddings: true

tpn:
  seed: 42
  epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  detach_assignments: true
  target_weight_st: 1.0

adapter:
  type: residual_mlp
  bottleneck_dim: 256
  dropout: 0.05
  scale: 0.1
  init_last_zero: true

loss_weights:
  src: 1.0
  proto: 0.5
  kl: 0.5
  ent: 0.01
  div: 0.05
  preserve: 0.25

gating:
  confidence_threshold: 0.35
  margin_threshold: 0.03
  ambiguous_rule: confidence_or_margin

bertopic:
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null
  umap:
    enabled: true
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom
  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]
  representation:
    enabled: false

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: false
