method_name: supervised_macro_geo_ft
corpus: metallurgie
method_display_name: "Supervised macro geo FT (CE+λ·L_geo) + BERTopic"

checkpoint: output/supervised_macro_geo_ft/checkpoints/best_model

# run_bertopic: true  → phase BERTopic (clustering + titres topics LLM)
# run_bertopic: false → classification macro uniquement
run_bertopic: true

# judge_enable: true  → si run_bertopic=true, appels LLM juge qualité topics
# judge_enable: false → BERTopic + titres topics seulement (pas de juge)
judge_enable: true

target:
  dataset_path: dataset/test/data_metallurgie.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  raw_emb_csv: embeddings/test/Qwen3-Embedding-0.6B_metallurgie.csv

model:
  max_seq_length: 256
  encode_batch_size: 32
  device: cuda
  reuse_cached_embeddings: true

exports:
  save_target_embeddings: true
  save_bertopic_inputs: true

bertopic_shared: configs/bertopic_macro_shared.yaml
