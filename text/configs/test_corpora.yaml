# Registre des corpus annotés (BTP + corpus hors domaine).
# Convention : dataset/data_<id>.csv
# Embeddings : embeddings/Qwen3-Embedding-0.6B_<id>.csv

default: metallurgie

corpora:
  btp:
    display_name: BTP
    data_csv: dataset/data_btp.csv
    emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv
    prompt_context: btp

  metallurgie:
    display_name: Métallurgie
    data_csv: dataset/data_metallurgie.csv
    emb_csv: embeddings/Qwen3-Embedding-0.6B_metallurgie.csv
    prompt_context: metallurgie

  caou:
    display_name: Caoutchouc / chimie / plastiques
    data_csv: dataset/data_caou.csv
    emb_csv: embeddings/Qwen3-Embedding-0.6B_caou.csv
    prompt_context: caou
