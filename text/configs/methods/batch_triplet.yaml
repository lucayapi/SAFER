method_name: batch_triplet
method: batch_triplet
output_dir: output/batch_triplet
use_prompt: false
seed: 42
n_folds: 3
selection_metric: balanced_accuracy
test_corpora: [metallurgie, caou, nicollin]

data:
  dataset_path: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok
  val_ratio: 0.1

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  max_seq_length: 256
  backbone_trainable: false
  train_last_n_layers: null
  cache_backbone_embeddings: true
  use_projector: true
  projection: linear
  hiddim: 128

training:
  batch_size: 64
  eval_batch_size: 16
  encode_batch_size: 16
  epochs: 30
  early_stopping_patience: 3
  early_stopping_inner_val_ratio: 0.1
  final_epochs_from_cv: true
  learning_rate: 2.0e-5
  gradient_accumulation_steps: 1
  distance_metric: euclidean

batch_triplet:
  loss_type: soft_margin

post_eval:
  enabled: true
  classifier: logistic_regression
  class_weight: null
  oversampling: false
