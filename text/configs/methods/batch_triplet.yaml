method_name: batch_triplet
method: batch_triplet
output_dir: output/batch_triplet
use_prompt: false
seed: 42
n_folds: 5
selection_metric: eta2_macro_balanced_perc
test_corpus: metallurgie

data:
  dataset_path: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok
  val_ratio: 0.1

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  max_seq_length: 256

training:
  batch_size: 16
  eval_batch_size: 16
  encode_batch_size: 16
  epochs: 30
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  distance_metric: euclidean

# BatchHardSoftMarginTripletLoss (SBERT) — voir loss_overview SBERT
batch_triplet:
  log_diagnostics: false
  diagnostics_every_steps: 50
  diagnostics_eps: 1.0e-6
  implementation: sentence_transformers  # sentence_transformers | custom_diagnostics
  loss_type: soft_margin  # soft_margin | hard
  # triplet_margin: 5.0  # pour loss_type: hard (BatchHardTripletLoss)
