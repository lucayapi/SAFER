method_name: supcon
method: supcon
output_dir: output/supcon
use_prompt: false
seed: 42
n_folds: 5
selection_metric: balanced_accuracy
test_corpora: [metallurgie, caou]

data:
  dataset_path: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok
  val_ratio: 0.1

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  max_seq_length: 256
  backbone_trainable: false
  train_last_n_layers: null
  cache_backbone_embeddings: true
  use_projector: true
  projection: linear
  hiddim: 128

training:
  batch_size: 8
  eval_batch_size: 8
  encode_batch_size: 8
  epochs: 30
  learning_rate: 2.0e-5
  gradient_accumulation_steps: 1
  distance_metric: cosine

post_eval:
  enabled: true
  classifier: logistic_regression
  class_weight: null
  oversampling: false

supcon:
  temperature: 0.07
  base_temperature: 0.07
  contrast_mode: all
  normalize_embeddings: true
