# Fine-tuning supervisé macro (CE) — config entraînement BTP
#
# Modes backbone (model.backbone_trainable + model.train_last_n_layers) :
#   A gelé + projecteur : backbone_trainable: false, cache_backbone_embeddings: true
#   B partiel           : backbone_trainable: true, train_last_n_layers: 4
#   C complet           : backbone_trainable: true, train_last_n_layers: null
#
# Projecteur (model.projection) :
#   linear      — Linear(d_in → hiddim), défaut doux
#   ln_gelu     — Linear → LayerNorm → GELU → Linear (proj_hidden intermédiaire)
#   residual    — LayerNorm(h + α·g(h)) puis Linear → hiddim (proj_bottleneck pour g)
#   mlp_sklearn — baseline notebook 07 : Linear(1024→256) → ReLU → Linear(256→128) ; hiddim forcé à 128

method_name: supervised_macro_ft
output_dir: output/supervised_macro_ft
test_corpus: metallurgie

data:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  backbone_trainable: false
  train_last_n_layers: null
  max_seq_length: 256
  pooling: mean
  projection: linear
  hiddim: 512
  proj_hidden: 512
  proj_bottleneck: 256
  proj_alpha: 0.1
  dropout: 0.1
  n_classes: 4
  class_weight: balanced
  gradient_checkpointing: false
  cache_backbone_embeddings: true
  backbone_emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv
  # projection: ln_gelu
  # hiddim: 256
  # projection: residual
  # proj_bottleneck: 256
  # proj_alpha: 0.1

training:
  n_folds: 5
  seed: 42
  selection_metric: macro_f1
  epochs: 10
  batch_size: 32
  lr_backbone: 2.0e-5
  lr_projector: 1.0e-3
  lr_head: 1.0e-3
  weight_decay: 0.01
  early_stopping_patience: 2

exports:
  save_btp_embeddings: true
