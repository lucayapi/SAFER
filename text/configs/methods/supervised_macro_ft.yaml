# Fine-tuning supervisé macro (CE) — encodeur Qwen partiellement / entièrement FT.
#
# Variantes article (job variants) :
#   Encoder : last 1 / 2 / 3 layers, ou full (train_last_n_layers: null)
#   Projecteur : mlp_sklearn (Yes) | null (No)
#   Loss : CE + class_weight=balanced (pas d'oversampling, pas d'encodeur gelé)
#
# Projecteur :
#   mlp_sklearn — Linear(1024→256) → ReLU → Linear(256→128)
#   null        — pas de ψ : tête Linear(d_backbone → n_classes)

method_name: supervised_macro_ft
output_dir: output/supervised_macro_ft
test_corpora:
  - metallurgie
  - caou
  - nicollin

data:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  backbone_trainable: true
  train_last_n_layers: 3
  max_seq_length: 256
  pooling: mean
  projection: mlp_sklearn
  hiddim: 128
  proj_hidden: 256
  dropout: 0.1
  n_classes: 4
  oversampling: false
  class_weight: balanced
  gradient_checkpointing: true
  cache_backbone_embeddings: false
  standardize_backbone: false

training:
  n_folds: 3
  seed: 42
  selection_metric: balanced_accuracy
  epochs: 30
  batch_size: 32
  lr_backbone: 2.0e-5
  lr_projector: 1.0e-3
  lr_head: 1.0e-3
  weight_decay: 0.01
  early_stopping_patience: 2
  use_amp: true

exports:
  save_btp_embeddings: true
  save_checkpoint: true
