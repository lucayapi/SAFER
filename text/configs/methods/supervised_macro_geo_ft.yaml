# Fine-tuning supervisé macro (CE + L_geo) — préservation similarités Qwen
#
# Loss : L = L_CE + lambda_geo * L_geo
# L_geo = MSE(cos(z_i, z_j), cos(h_i, h_j)) hors diagonale
#
# Projecteur : linear | ln_gelu | residual (voir supervised_macro_ft.yaml)

method_name: supervised_macro_geo_ft
output_dir: output/supervised_macro_geo_ft
test_corpus: metallurgie

data:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  pred_ok_col: pred_ok

model:
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  backbone_trainable: false
  train_last_n_layers: null
  max_seq_length: 256
  pooling: mean
  projection: linear
  hiddim: 512
  proj_hidden: 512
  proj_bottleneck: 256
  proj_alpha: 0.1
  dropout: 0.1
  n_classes: 4
  class_weight: balanced
  gradient_checkpointing: false
  cache_backbone_embeddings: true
  standardize_backbone: false
  backbone_emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv

training:
  n_folds: 5
  seed: 42
  selection_metric: macro_f1
  epochs: 10
  batch_size: 32
  lr_backbone: 2.0e-5
  lr_projector: 1.0e-3
  lr_head: 1.0e-3
  weight_decay: 0.01
  early_stopping_patience: 2
  lambda_geo: 0.1
  geo_remove_diag: true

exports:
  save_btp_embeddings: true
