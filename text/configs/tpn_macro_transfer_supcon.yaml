# TPN avec encodeur SupCon gelé (sortie : tpn_supcon/)
corpus: metallurgie

checkpoints:
  supcon: output/supcon/checkpoints/best_model

source:
  data_csv: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok
  group_col: accident_id

target:
  text_col: sentence
  label_col: pred_label
  pred_ok_col: pred_ok

method:
  base_method: supcon
  checkpoint: output/supcon/checkpoints/best_model
  contrastive_config: configs/methods/supcon.yaml

encoding:
  device: cuda
  encode_batch_size: 8
  normalize_embeddings: true

tpn:
  seed: 42
  epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  tau: 0.3
  distance_metric: euclidean
  assignment_mode: soft
  detach_assignments: true
  target_weight_st: 1.0

adapter:
  type: residual_mlp
  bottleneck_dim: 256
  dropout: 0.05
  scale: 0.1
  init_last_zero: true

loss_weights:
  src: 1.0
  proto: 0.5
  kl: 0.5
  ent: 0.01
  div: 0.05
  preserve: 0.25

gating:
  confidence_threshold: 0.35
  margin_threshold: 0.03
  ambiguous_rule: confidence_or_margin

bertopic:
  enabled: true
  embedding_space:
    mode: mixed
    alpha: 0.25
    normalize: true
  macro_params:
    A0: {min_topic_size: 25, min_cluster_size: 25, min_samples: 3, cluster_selection_method: leaf, n_neighbors: 10, n_components: 5, min_dist: 0.0}
    A1: {min_topic_size: 20, min_cluster_size: 20, min_samples: 3, cluster_selection_method: leaf, n_neighbors: 10, n_components: 5, min_dist: 0.0}
    B: {min_topic_size: 35, min_cluster_size: 35, min_samples: 10, cluster_selection_method: eom, n_neighbors: 15, n_components: 5, min_dist: 0.0}
    C: {min_topic_size: 70, min_cluster_size: 70, min_samples: 15, cluster_selection_method: eom, n_neighbors: 20, n_components: 5, min_dist: 0.0}
  grid_search:
    enabled: false
  diagnostics:
    enabled: true
    compute_compression: true
  include_ambiguous: true
  min_topic_size: 10
  nr_topics: null
  top_n_words: 10
  n_gram_range: [1, 2]
  calculate_probabilities: true
  verbose: false
  random_state: 42
  stop_words_file: null
  umap:
    enabled: true
    n_components: 5
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
  hdbscan:
    min_cluster_size: null
    min_samples: null
    metric: euclidean
    cluster_selection_method: eom
  vectorizer:
    min_df: 1
    max_df: null
    ngram_range: [1, 2]
  representation:
    enabled: false

topics_export:
  top_k_words: 12
  top_k_sentences: 5

skip_bertopic: false
