method_name: frozen_source_prototypes
corpus: metallurgie
method_display_name: "SoftTriple (centres natifs) + prototypes gelés"

method:
  base_method: softtriple_native
  backbone_name: Qwen/Qwen3-Embedding-0.6B
  max_seq_length: 256
  encode_batch_size: 32
  device: cuda

checkpoints:
  softtriple_native: output/softtriple/checkpoints/best_model
  softtriple: output/softtriple/checkpoints/best_model

# output_test/<corpus>/macro_transfer/frozen_source_prototypes/softtriple_native

source:
  dataset_path: dataset/data_btp.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id
  filter_pred_ok: true
  pred_ok_col: pred_ok
  source_emb_csv: embeddings/Qwen3-Embedding-0.6B_btp.csv

target:
  dataset_path: dataset/test/data_metallurgie.csv
  text_col: sentence
  label_col: pred_label
  group_col: accident_id

model:
  reuse_cached_embeddings: true
  force_reencode: false

prototype_transfer:
  macros: ["A0", "A1", "B", "C"]
  distance_metric: cosine
  normalize_embeddings: true
  tau: 0.07
  eps: 1.0e-12
  softtriple:
    use_native_centers: true
    gamma: null
    temperature: null
    distance_metric: cosine

# run_bertopic: true  → transfert macro + BERTopic + topic judge (défaut)
# run_bertopic: false → transfert macro / classification uniquement
run_bertopic: true

exports:
  save_source_embeddings: false
  save_target_embeddings: true
  save_prototypes: true
  save_probabilities: true
  save_bertopic_inputs: true

bertopic_shared: configs/bertopic_macro_shared.yaml
