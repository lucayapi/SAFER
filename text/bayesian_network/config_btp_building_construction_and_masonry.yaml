# Building construction and masonry family, using the refreshed Qwen embeddings.
analysis_id: btp_building_construction_and_masonry

data:
  units_path: ../dataset/families/btp/data_btp_building_construction_and_masonry.csv
  embeddings_path: ../embeddings/families/btp/Qwen3-Embedding-0.6B_btp_building_construction_and_masonry.csv
  accident_id_col: accident_id
  fact_id_col: fact_id
  unit_id_col: fact_id
  text_col: sentence
  role_col: pred_label
  valid_col: pred_ok
  embedding_id_col: doc_id
  embedding_dimensions_prefix: dim_
  normalize_embeddings: true
  fail_on_unmatched_units: true

parallel:
  enabled: true
  n_workers: auto
  max_workers: 20
  backend: loky

screening:
  show_progress: true
  # Legacy general recurrent-scenarios grid: 4 x 3 x 3 x 2 = 72
  # UMAP/HDBSCAN candidates per role. min_dist and selection method are fixed.
  umap:
    n_neighbors: [10, 20, 40, 80]
    n_components: [5, 10, 15]
    min_dist: [0.0]
    metric: cosine
    low_memory: true
    n_jobs: 1
  hdbscan:
    min_cluster_size: [15, 25, 50]
    min_samples: [5, 10]
    cluster_selection_method: [leaf]
    metric: euclidean
    prediction_data: true

clustering_selection:
  random_state: 42
  resampling_fraction: 0.8
  n_resampling: 30
  dbcv_sample_size: 12000
  selection_metric: pareto_normalized_tchebycheff
  show_progress: true
  seed_sensitivity:
    enabled: false
    seeds: []

topics:
  top_words: 12
  top_sentences: 5
  n_gram_range: [1, 2]
  min_topic_frequency: 1
  idf_smoothing: 1.0
  stopwords_file: ../recurrent_scenarios/stop_metier.txt
  additional_stopwords: []
  stopwords: [le, la, les, un, une, des, de, du, et, en, dans, sur, au, aux, que, qui, est, a, avec, pour, par, ce, cette, son, sa, ses, il, elle, ils, elles]

factor_annotation:
  enabled: true
  model: gpt-5.6-luna
  reasoning_effort: medium
  max_output_tokens: 4000
  output_language: English
  prompt_version: bayesian-network-btp-building-construction-masonry-v1
  representative_sentences: 50

network:
  max_parents: 2
  jeffreys_alpha: 0.5
  # Descriptive motif screen applied to the complete accident matrix.
  scenario_min_count: 5
  scenario_two_b_sensitivity: true
  scenario_mc_draws: 20000
  bootstrap_replicates: 100
  bootstrap_seed: 42042
  bootstrap_parallel: true
