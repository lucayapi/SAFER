# Original support-3 candidate screen, retained for reproducible complexity audits.
# Its exact K=3 preflight exceeds 10 million cover groups for one basket.
data:
  source_run: bayesian_network/runs/btp_building_construction_and_masonry_20261019T215227Z
output_dir: theme_dictionary/runs/btp_building_construction_and_masonry_support3

model:
  max_theme_length: 4
  min_observed_count: 3
  overlap_values: [3, 1]
  initial_scales: [0.25, 0.5, 1.0]
  em_tolerance: 1.0e-8
  em_max_iterations: 1000
  max_groups_per_component: 250000
  max_total_groups: 2000000

parallel:
  workers: 24
