# The source is supplied by --source-run in the Slurm job. All paths are
# relative to text/. No discovery or embedding calculation occurs here.
data:
  source_run: bayesian_network/runs/curated_leaf_matrix
output_dir: theme_dictionary/runs/curated_leaf

model:
  max_theme_length: 4
  min_observed_count: 12
  overlap_values: [3, 1]
  initial_scales: [0.25, 0.5, 1.0]
  em_tolerance: 1.0e-8
  em_max_iterations: 1000
  max_groups_per_component: 250000
  max_total_groups: 2000000

parallel:
  workers: 24
